name: Lean v9 reproducibility check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original-source hashes
        run: python3 scripts/verify_sources.py
      - name: Set up Lean and build all primary modules
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
      - name: Explicit target statement and standard-axiom report
        shell: bash
        run: |
          set -o pipefail
          lake env lean TPCV9/StatementAudit.lean | tee lean_axioms.txt
          python3 scripts/check_axiom_report.py lean_axioms.txt
      - name: Preserve axiom report even if review is incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-statement-and-axiom-report
          path: lean_axioms.txt
          if-no-files-found: ignore
